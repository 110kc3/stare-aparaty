<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Klatka nieznaleziona · Stare Aparaty</title>
  <meta name="description" content="Ta strona nie istnieje. Wróć do katalogu aparatów analogowych.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#0e0b08">
  <!-- Self-hosted fonts, same set as the catalog page — no third-party request
       (and nothing for a visitor to consent to on an error page). -->
  <link rel="stylesheet" href="fonts/fonts.css">
  <script>
    (function(){
      try {
        var t = localStorage.getItem('theme');
        var dark = t === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', dark);
      } catch(e) {}
    })();
  </script>
  <style>
    :root {
      --bg:        #0e0b08;
      --bg-2:      #141009;
      --bg-strip:  #1a1612;
      --ink:       #f2e8d8;
      --ink-soft:  #7a6e60;
      --ink-faint: #3a3127;
      --gold:      #f5d06e;
      --gold-dim:  #c4a044;
      --line:      #2a2218;
      --line-gold: #f5d06e;
      --retro:     "Press Start 2P", "Courier New", monospace;
      --serif:     "Cormorant Garamond", "Times New Roman", serif;
      --sans:      "Inter", "Segoe UI", sans-serif;
    }
    [data-theme="light"] {
      --bg:        #f6f1e8;
      --bg-2:      #faf7f2;
      --bg-strip:  #e8e0d4;
      --ink:       #1c1815;
      --ink-soft:  #5f564d;
      --ink-faint: #c8bfb4;
      --gold:      #7a5a18;
      --gold-dim:  #9a7428;
      --line:      #d8cfc3;
      --line-gold: #7a5a18;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background 200ms, color 200ms;
    }

    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(200,180,150,0.025) 0, rgba(200,180,150,0.025) 1px,
        transparent 1px, transparent 5px
      );
    }

    .frame {
      position: relative; z-index: 1;
      width: min(560px, 100%);
      border: 2px solid var(--line-gold);
      background: var(--bg-2);
      padding: 40px 36px 36px;
      text-align: center;
    }

    .label {
      display: inline-block;
      font-family: var(--retro);
      font-size: 7px;
      letter-spacing: 0.1em;
      line-height: 1.6;
      color: var(--gold);
      padding: 3px 10px;
      border: 1px solid var(--gold-dim);
    }

    .filmstrip {
      height: 18px;
      margin: 24px -36px;
      background: var(--bg-strip);
      border-top: 2px solid var(--line-gold);
      border-bottom: 2px solid var(--line-gold);
      background-image: repeating-linear-gradient(
        90deg,
        transparent 0, transparent 28px,
        var(--ink-faint) 28px, var(--ink-faint) 34px
      );
    }

    .code {
      font-family: var(--retro);
      font-size: 56px;
      letter-spacing: 0.04em;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 14px;
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(2rem, 4vw, 2.6rem);
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    p {
      font-size: 13px;
      color: var(--ink-soft);
      max-width: 420px;
      margin: 0 auto 22px;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      text-decoration: none;
      border: 1px solid var(--gold-dim);
      color: var(--gold);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: background 150ms, color 150ms;
    }
    .home-link:hover { background: var(--gold); color: #111; }

    @media (max-width: 480px) {
      .frame { padding: 28px 22px 26px; }
      .filmstrip { margin: 20px -22px; }
      .code { font-size: 42px; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <span class="label">STARE APARATY</span>
    <div class="filmstrip" aria-hidden="true"></div>
    <p class="code">404</p>
    <h1>Klatka nieznaleziona</h1>
    <p>Negatyw poszedł na straty — strony, której szukasz, nie ma w archiwum. Wróć do katalogu, tam czekają sprawne aparaty i filmy.</p>
    <a class="home-link" href="https://stareaparaty.com/">Wróć do katalogu <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
