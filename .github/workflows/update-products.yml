name: Update cameras from links

on:
  workflow_dispatch:
    inputs:
      links:
        description: 'Paste product links separated by semicolons (;) or new lines'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Save workflow input to a temporary file
        env:
          LINKS_INPUT: ${{ github.event.inputs.links }}
        run: |
          printf "%s" "$LINKS_INPUT" > workflow-links.txt

      - name: Rebuild catalog from provided links
        run: node scripts/build-catalog.js --links-file workflow-links.txt --write-links-file

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet --exit-code; then
            echo "No changes to commit."
            exit 0
          fi

          git add index.html olx_meta.json product-links.txt
          git commit -m "chore: update camera catalog"
          git push
