name: Deploy static site to GitHub Pages

# Push deploys are now handled by discover-cameras.yml, which discovers,
# rebuilds, and publishes in a single run (so a push can't double-deploy and
# fight this workflow over the shared github-pages concurrency group). This
# workflow stays available for manual, on-demand deploys.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static catalog
        run: node scripts/build-catalog.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Only the public-facing files go into the artifact — uploading the
      # whole repo would publish internal docs (TODO.md, GROWTH-PLAN.md,
      # STATUS-REPORT.md), scripts, and templates on the live site.
      - name: Assemble site artifact
        run: |
          mkdir dist
          cp index.html 404.html favicon.svg og-image.png robots.txt sitemap.xml site.webmanifest \
             apple-touch-icon.png icon-192.png icon-512.png llms.txt llms-full.txt CNAME olx_meta.json dist/
          cp scripts/amazon-products.json scripts/allegro-products.json dist/
          cp -r fonts dist/
          cp -r .well-known dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
