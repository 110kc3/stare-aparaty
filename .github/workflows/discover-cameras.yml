name: Discover cameras from OLX

on:
  schedule:
    # Every day at 05:30 UTC. Adjust or remove as you like.
    - cron: '30 5 * * *'
  push:
    branches:
      - main
      - master
      - update-film-info
  workflow_dispatch:

# Needs contents:write to commit the refreshed files, plus pages/id-token to
# publish to GitHub Pages in the same run (no reliance on a second workflow,
# which GITHUB_TOKEN pushes can't trigger anyway).
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  discover-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Discover listings from OLX user page
        run: node scripts/discover-listings.js

      - name: Rebuild catalog
        run: node scripts/build-catalog.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet --exit-code; then
            echo "No changes to commit."
          else
            git add index.html olx_meta.json product-links.txt sitemap.xml ads.txt polityka-prywatnosci.html poradniki
            git commit -m "chore: auto-discover camera catalog"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Only the public-facing files go into the artifact — uploading the
      # whole repo would publish internal docs (TODO.md, GROWTH-PLAN.md,
      # STATUS-REPORT.md), scripts, and templates on the live site.
      - name: Assemble site artifact
        run: |
          mkdir dist
          cp index.html 404.html polityka-prywatnosci.html favicon.svg og-image.png robots.txt \
             sitemap.xml ads.txt site.webmanifest \
             apple-touch-icon.png icon-192.png icon-512.png llms.txt llms-full.txt CNAME olx_meta.json dist/
          cp scripts/amazon-products.json scripts/allegro-products.json dist/
          cp -r fonts poradniki dist/
          cp -r .well-known dist/
          # A2A 1.0 reads /.well-known/agent-card.json; /.well-known/agent.json is
          # the pre-0.3 path a 1.0 client never looks at. Derived at deploy from the
          # one committed card so the two paths cannot drift apart.
          cp .well-known/agent.json dist/.well-known/agent-card.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
